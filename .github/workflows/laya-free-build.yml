name: Free LayaAir 3.4 build and preview sync

on:
  workflow_dispatch:
  schedule:
    # Public-repository runner avoids exhausting paid/private Actions minutes.
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: laya-preview-sync
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check private source access has been configured
        id: gate
        env:
          SOURCE_TOKEN: ${{ secrets.PREVIEW_SOURCE_SYNC_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::To enable LayaAir builds, add the PREVIEW_SOURCE_SYNC_TOKEN Actions secret (Contents read for BaiMaGod/erhetafang and Contents write for BaiMaGod/erhetafang-preview)."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout public preview distribution
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PREVIEW_SOURCE_SYNC_TOKEN }}
          persist-credentials: true
          path: preview

      - name: Checkout private LayaAir source
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: BaiMaGod/erhetafang
          ref: feat/laya34-migration-m1
          token: ${{ secrets.PREVIEW_SOURCE_SYNC_TOKEN }}
          persist-credentials: false
          path: source

      - name: Compare source commit against deployed version
        if: steps.gate.outputs.enabled == 'true'
        id: check
        shell: bash
        run: |
          sha="$(git -C source rev-parse HEAD)"
          printf '%s\n' "$sha" > /tmp/laya-source-sha
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -f preview/laya/.source-commit ] && [ "$(cat preview/laya/.source-commit)" = "$sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already deployed from source commit $sha"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js for Laya compilation
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned compiler and Chromium
        if: steps.check.outputs.changed == 'true'
        working-directory: source
        run: |
          npm install --no-save --no-package-lock typescript@5.9.3 playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build real LayaAir 3.4.0 standalone WebGL site
        if: steps.check.outputs.changed == 'true'
        working-directory: source
        run: npm run build:laya

      - name: Run gameplay regression
        if: steps.check.outputs.changed == 'true'
        working-directory: source
        run: npm test

      - name: Chromium WebGL gameplay and legacy parity QA
        if: steps.check.outputs.changed == 'true'
        working-directory: source
        run: npm run test:laya

      - name: Archive Laya Chromium screenshots
        if: always() && steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: laya-preview-chromium
          path: source/laya/test-output/
          if-no-files-found: warn

      - name: Copy ONLY compiled Laya site into public preview
        if: steps.check.outputs.changed == 'true'
        shell: bash
        run: |
          test -s source/dist/laya/index.html
          test -s source/dist/laya/libs/laya.core.js
          test -s source/dist/laya/libs/laya.opengl_2D.js
          rm -rf preview/laya
          mkdir -p preview/laya
          cp -a source/dist/laya/. preview/laya/
          cp /tmp/laya-source-sha preview/laya/.source-commit
          test -s preview/laya/manifest.json
          # Verify no private tests, docs, TypeScript or build scripts were copied.
          if find preview/laya -type f \( -name '*.ts' -o -name '*.py' -o -name '*.cjs' \) | grep -q .; then
            echo 'Unexpected source files in public preview' >&2
            exit 1
          fi

      - name: Publish compiled site to existing Pages branch
        if: steps.check.outputs.changed == 'true'
        working-directory: preview
        shell: bash
        run: |
          git config user.name "preview-deploy-bot"
          git config user.email "47746427+BaiMaGod@users.noreply.github.com"
          git add -- laya/
          if git diff --cached --quiet; then
            echo 'Static artifacts unchanged, no publish needed.'
            exit 0
          fi
          git commit -m "deploy(laya): verified 3.4 WebGL build [preview-sync]"
          git push origin HEAD:main
          echo 'Deployed verified Laya build to the public Pages /laya/ directory.'
